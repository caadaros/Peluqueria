version: "3.9"

# ════════════════════════════════════════════════════════════════
# Docker Compose - Sistema Peluquería (ejecución 100% local)
# ════════════════════════════════════════════════════════════════
# Orden de arranque controlado con depends_on + healthcheck:
#   1. eureka
#   2. cliente, profesional, tipoServicio, disponibilidadProfesional
#   3. agenda (depende de los anteriores)
#   4. gateway (depende de todos)
#
# Variables sensibles (usuario/clave Oracle) se inyectan desde el
# archivo .env (no se sube a git). Ver .env.example adjunto.
# ════════════════════════════════════════════════════════════════

services:

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: peluqueria-eureka
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - peluqueria-net

  cliente:
    build:
      context: ./cliente
      dockerfile: Dockerfile
    container_name: peluqueria-cliente
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - peluqueria-net

  profesional:
    build:
      context: ./profesional
      dockerfile: Dockerfile
    container_name: peluqueria-profesional
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - peluqueria-net

  tipoServicio:
    build:
      context: ./tipoServicio
      dockerfile: Dockerfile
    container_name: peluqueria-tiposervicio
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - peluqueria-net

  disponibilidadProfesional:
    build:
      context: ./disponibilidadProfesional
      dockerfile: Dockerfile
    container_name: peluqueria-disponibilidad
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
      profesional:
        condition: service_started
    networks:
      - peluqueria-net

  agenda:
    build:
      context: ./agenda
      dockerfile: Dockerfile
    container_name: peluqueria-agenda
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
      cliente:
        condition: service_started
      profesional:
        condition: service_started
      tipoServicio:
        condition: service_started
      disponibilidadProfesional:
        condition: service_started
    networks:
      - peluqueria-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: peluqueria-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
      cliente:
        condition: service_started
      profesional:
        condition: service_started
      tipoServicio:
        condition: service_started
      disponibilidadProfesional:
        condition: service_started
      agenda:
        condition: service_started
    networks:
      - peluqueria-net

networks:
  peluqueria-net:
    driver: bridge
